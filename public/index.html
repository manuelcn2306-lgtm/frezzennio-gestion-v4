<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#102b46">
  <title>FREZZENIO V4</title>

  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui;background:#f2f6fa;color:#193047}
    .top{background:#102b46;color:#fff;padding:15px;position:sticky;top:0}
    .wrap{max-width:1050px;margin:auto;padding:12px}
    .card{background:#fff;border-radius:14px;padding:14px;margin:10px 0}
    .nav{display:flex;gap:7px;overflow:auto}
    .btn,.nav button{border:0;border-radius:9px;padding:10px;background:#2878b8;color:white;font-weight:700;white-space:nowrap}
    input,select{width:100%;padding:10px;border:1px solid #ccd7e2;border-radius:8px;margin:4px 0 9px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .hide{display:none}
    .i{padding:8px 0;border-bottom:1px solid #eee;font-size:13px}
    .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .k{background:white;padding:12px;border-radius:12px}
    .k b{display:block;font-size:18px}
    .muted{color:#718398;font-size:12px}
    .good{color:#177745}
    .warn{color:#b25318}
  </style>
</head>

<body>

<header class="top">
  <b>FREZZENIO · Gestión V4</b>
  <div class="muted" style="color:#c8d9e8">
    Base central · Multiusuario · Producción · Costes · Caja automática
  </div>
</header>

<main class="wrap">

  <section id="loginScreen" class="card">
    <h2>Acceso</h2>
    <input id="user" placeholder="Usuario">
    <input id="pass" type="password" placeholder="Contraseña">

    <button class="btn" type="button" onclick="doLogin()">
      Entrar
    </button>

    <p id="err" class="warn"></p>
  </section>

  <section id="app" class="hide">
    <div class="nav" id="nav"></div>
    <div class="card" id="screen"></div>
  </section>

</main>

<script>
const $ = (id) => document.getElementById(id);

const today = () => new Date().toISOString().slice(0, 10);

const money = (n) =>
  Number(n || 0).toLocaleString('es-CO', {
    style: 'currency',
    currency: 'COP',
    maximumFractionDigits: 0
  });

let S = {
  ingredients: [],
  products: [],
  orders: [],
  sales: [],
  expenses: [],
  cash: []
};


/* =========================
   API
========================= */

async function api(url, options = {}) {
  const response = await fetch(url, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(options.headers || {})
    }
  });

  const contentType = response.headers.get('content-type') || '';

  let data;

  if (contentType.includes('application/json')) {
    data = await response.json();
  } else {
    const text = await response.text();

    throw new Error(
      response.ok
        ? `Respuesta no válida del servidor en ${url}`
        : text || `Error HTTP ${response.status}`
    );
  }

  if (!response.ok) {
    throw new Error(
      data && data.error
        ? data.error
        : `Error HTTP ${response.status}`
    );
  }

  return data;
}


/* =========================
   ESTADO
========================= */

async function refresh() {
  const data = await api('/api/state');

  S = {
    ingredients: Array.isArray(data?.ingredients)
      ? data.ingredients
      : [],

    products: Array.isArray(data?.products)
      ? data.products
      : [],

    orders: Array.isArray(data?.orders)
      ? data.orders
      : [],

    sales: Array.isArray(data?.sales)
      ? data.sales
      : [],

    expenses: Array.isArray(data?.expenses)
      ? data.expenses
      : [],

    cash: Array.isArray(data?.cash)
      ? data.cash
      : []
  };
}


/* =========================
   LOGIN
========================= */

async function doLogin() {
  try {
    $('err').textContent = '';

    await api('/api/login', {
      method: 'POST',
      body: JSON.stringify({
        username: $('user').value.trim(),
        password: $('pass').value
      })
    });

    $('loginScreen').classList.add('hide');
    $('app').classList.remove('hide');

    await refresh();
    openM('dash');

  } catch (error) {
    console.error(error);
    $('err').textContent = error.message;
  }
}


/* =========================
   NAVEGACIÓN
========================= */

const mods = [
  ['Panel', 'dash'],
  ['Inventario', 'inv'],
  ['Compras', 'buy'],
  ['Recetas', 'recipes'],
  ['Órdenes', 'orders'],
  ['Ventas', 'sales'],
  ['Gastos', 'expenses'],
  ['Caja', 'cash']
];

$('nav').innerHTML = mods
  .map(
    ([label, module]) =>
      `<button type="button" onclick="openM('${module}')">${label}</button>`
  )
  .join('');


/* =========================
   UTILIDADES DE FORMULARIOS
========================= */

function opts(array, textFn) {
  if (!Array.isArray(array) || array.length === 0) {
    return '<option value="">Sin registros disponibles</option>';
  }

  return array
    .map(
      (item) =>
        `<option value="${item.id}">${textFn(item)}</option>`
    )
    .join('');
}


function field(label, id, type = 'text', value = '') {
  return `
    <label for="${id}">${label}</label>
    <input
      id="${id}"
      type="${type}"
      value="${value}"
    >
  `;
}


function showError(error) {
  console.error(error);

  const screen = $('screen');

  if (!screen) return;

  screen.innerHTML = `
    <h2>Error</h2>

    <p class="warn">
      ${error?.message || 'Se produjo un error inesperado.'}
    </p>

    <p class="muted">
      Si este mensaje vuelve a aparecer, copia exactamente el texto del error.
    </p>
  `;
}


/* =========================
   PANTALLAS
========================= */

function openM(module) {
  try {

    let html = '';


    /* PANEL */

    if (module === 'dash') {

      const salesTotal = S.sales.reduce(
        (sum, item) =>
          sum + Number(item.total || 0),
        0
      );

      const cashTotal = S.cash.reduce(
        (sum, item) => {
          const amount = Number(item.amount || 0);

          return sum +
            (item.type === 'IN'
              ? amount
              : -amount);
        },
        0
      );

      html = `
        <h2>Panel</h2>

        <div class="kpis">

          <div class="k">
            Ventas
            <b>${money(salesTotal)}</b>
          </div>

          <div class="k">
            Saldo movimientos caja
            <b>${money(cashTotal)}</b>
          </div>

          <div class="k">
            Ingredientes
            <b>${S.ingredients.length}</b>
          </div>

          <div class="k">
            Órdenes
            <b>${S.orders.length}</b>
          </div>

        </div>
      `;
    }


    /* INVENTARIO */

    else if (module === 'inv') {

      html = `
        <h2>Inventario</h2>

        ${field('Nombre', 'name')}

        <div class="row">
          ${field('Unidad', 'unit', 'text', 'g')}
          ${field('Stock inicial', 'stock', 'number', '0')}
        </div>

        <div class="row">
          ${field('Stock mínimo', 'min', 'number', '0')}
          ${field('Coste base', 'cost', 'number', '0')}
        </div>

        <button
          class="btn"
          type="button"
          onclick="addInv()"
        >
          Crear
        </button>

        ${S.ingredients.map(item => `
          <div class="i">

            <b>
              ${item.code || ''} ·
              ${item.name || ''}
            </b>

            · stock ${item.stock ?? 0}
            ${item.unit || ''}

            · ${money(item.current_cost)}

          </div>
        `).join('')}
      `;
    }


    /* COMPRAS */

    else if (module === 'buy') {

      html = `
        <h2>Compra</h2>

        ${
          S.ingredients.length === 0
          ? `
            <p class="warn">
              Primero debes crear un ingrediente en Inventario.
            </p>
          `
          : ''
        }

        ${field('Fecha', 'date', 'date', today())}

        <label for="iid">
          Ingrediente
        </label>

        <select id="iid">
          ${opts(
            S.ingredients,
            item =>
              `${item.code || ''} · ${item.name || ''}`
          )}
        </select>

        <div class="row">

          ${field(
            'Cantidad',
            'qty',
            'number'
          )}

          ${field(
            'Total',
            'total',
            'number'
          )}

        </div>

        ${field(
          'Cuenta de pago',
          'account',
          'text',
          'Caja'
        )}

        <button
          class="btn"
          type="button"
          onclick="buy()"
        >
          Guardar compra + salida de caja
        </button>
      `;
    }


    /* RECETAS */

    else if (module === 'recipes') {

      html = `
        <h2>Receta</h2>

        ${
          S.ingredients.length === 0
          ? `
            <p class="warn">
              Primero debes crear ingredientes en Inventario.
            </p>
          `
          : ''
        }

        ${field(
          'Producto',
          'name'
        )}

        <div class="row">

          ${field(
            'Rendimiento',
            'yieldQty',
            'number',
            '1'
          )}

          ${field(
            'Precio venta',
            'price',
            'number'
          )}

        </div>

        <div id="rr"></div>

        <button
          class="btn"
          type="button"
          onclick="addRow()"
        >
          + Ingrediente
        </button>

        <div class="row">

          ${field(
            'Envase',
            'pack',
            'number',
            '0'
          )}

          ${field(
            'Otros',
            'other',
            'number',
            '0'
          )}

        </div>

        ${field(
          'Desperdicio %',
          'waste',
          'number',
          '0'
        )}

        <button
          class="btn"
          type="button"
          onclick="saveRecipe()"
        >
          Guardar receta
        </button>

        ${S.products.map(item => `
          <div class="i">

            <b>
              ${item.code || ''} ·
              ${item.name || ''}
            </b>

            · coste actual
            ${money(item.cost)}

            · stock terminado
            ${item.stock ?? 0}

          </div>
        `).join('')}
      `;
    }


    /* ÓRDENES */

    else if (module === 'orders') {

      html = `
        <h2>Órdenes de producción</h2>

        ${
          S.products.length === 0
          ? `
            <p class="warn">
              Primero debes crear una receta/producto.
            </p>
          `
          : ''
        }

        ${field(
          'Fecha',
          'date',
          'date',
          today()
        )}

        <label for="pid">
          Producto
        </label>

        <select id="pid">

          ${opts(
            S.products,
            item =>
              `${item.code || ''} · ${item.name || ''}`
          )}

        </select>

        ${field(
          'Unidades',
          'qty',
          'number'
        )}

        <button
          class="btn"
          type="button"
          onclick="createOrder()"
        >
          Crear orden
        </button>

        ${S.orders.map(item => `

          <div class="i">

            <b>
              ${item.code || ''} ·
              ${item.product_name || ''}
            </b>

            · ${item.qty ?? 0}
            · ${item.status || ''}

            ${
              item.status === 'PLANNED'
              ? `
                <button
                  class="btn"
                  type="button"
                  onclick="completeOrder(${Number(item.id)})"
                >
                  Completar
                </button>
              `
              : `
                · coste
                ${money(item.total_cost)}
              `
            }

          </div>

        `).join('')}
      `;
    }


    /* VENTAS */

    else if (module === 'sales') {

      html = `
        <h2>Venta</h2>

        ${
          S.products.length === 0
          ? `
            <p class="warn">
              Primero debes crear productos en Recetas.
            </p>
          `
          : ''
        }

        ${field(
          'Fecha',
          'date',
          'date',
          today()
        )}

        <label for="pid">
          Producto
        </label>

        <select id="pid">

          ${opts(
            S.products,
            item =>
              `${item.name || ''} · stock ${item.stock ?? 0}`
          )}

        </select>

        <div class="row">

          ${field(
            'Cantidad',
            'qty',
            'number',
            '1'
          )}

          ${field(
            'Precio unitario',
            'price',
            'number'
          )}

        </div>

        <label for="pay">
          Método de pago
        </label>

        <select id="pay">
          <option>Efectivo</option>
          <option>Nequi</option>
          <option>Daviplata</option>
          <option>Transferencia</option>
          <option>Tarjeta</option>
          <option>Crédito</option>
        </select>

        ${field(
          'Cuenta destino',
          'account',
          'text',
          'Caja'
        )}

        <button
          class="btn"
          type="button"
          onclick="sale()"
        >
          Guardar venta
        </button>
      `;
    }


    /* GASTOS */

    else if (module === 'expenses') {

      html = `
        <h2>Gasto</h2>

        ${field(
          'Fecha',
          'date',
          'date',
          today()
        )}

        ${field(
          'Concepto',
          'concept'
        )}

        <label for="type">
          Tipo
        </label>

        <select id="type">
          <option>Fijo</option>
          <option>Variable</option>
        </select>

        ${field(
          'Valor',
          'amount',
          'number'
        )}

        <label for="pay">
          Método de pago
        </label>

        <select id="pay">
          <option>Efectivo</option>
          <option>Transferencia</option>
          <option>Tarjeta</option>
        </select>

        ${field(
          'Cuenta',
          'account',
          'text',
          'Caja'
        )}

        <button
          class="btn"
          type="button"
          onclick="expense()"
        >
          Guardar gasto + salida de caja
        </button>
      `;
    }


    /* CAJA */

    else if (module === 'cash') {

      html = `
        <h2>Trazabilidad de caja</h2>

        ${
          S.cash.length === 0
          ? `
            <p class="muted">
              Todavía no hay movimientos de caja.
            </p>
          `
          : ''
        }

        ${S.cash.map(item => `

          <div class="i">

            <b>
              ${item.date || ''} ·
              ${item.account || ''}
            </b>

            ·
            ${item.type === 'IN' ? '+' : '-'}
            ${money(item.amount)}

            · ${item.concept || ''}

            · ${item.ref_type || ''}

            ${
              item.ref_id
              ? `#${item.ref_id}`
              : ''
            }

          </div>

        `).join('')}
      `;
    }


    else {
      throw new Error(
        `Módulo desconocido: ${module}`
      );
    }


    $('screen').innerHTML = html;


    if (
      module === 'recipes' &&
      S.ingredients.length > 0
    ) {
      addRow();
    }

  } catch (error) {
    showError(error);
  }
}


/* =========================
   FILAS DE RECETAS
========================= */

function addRow() {
  try {

    const container = $('rr');

    if (!container) {
      throw new Error(
        'No se encontró el formulario de receta.'
      );
    }

    if (S.ingredients.length === 0) {
      alert(
        'Primero debes crear un ingrediente en Inventario.'
      );
      return;
    }

    container.insertAdjacentHTML(
      'beforeend',
      `
        <div class="i">

          <label>
            Ingrediente
          </label>

          <select class="ri">

            ${opts(
              S.ingredients,
              item =>
                `${item.code || ''} · ${item.name || ''}`
            )}

          </select>

          <label>
            Cantidad
          </label>

          <input
            class="rq"
            type="number"
          >

        </div>
      `
    );

  } catch (error) {
    showError(error);
  }
}


/* =========================
   POST GENÉRICO
========================= */

async function post(url, body) {
  try {

    await api(url, {
      method: 'POST',
      body: JSON.stringify(body)
    });

    await refresh();

    return true;

  } catch (error) {

    console.error(error);

    alert(error.message);

    return false;
  }
}


/* =========================
   INVENTARIO
========================= */

async function addInv() {

  const nameEl = $('name');
  const unitEl = $('unit');
  const stockEl = $('stock');
  const minEl = $('min');
  const costEl = $('cost');

  if (
    !nameEl ||
    !unitEl ||
    !stockEl ||
    !minEl ||
    !costEl
  ) {
    showError(
      new Error(
        'No se encontró el formulario de Inventario.'
      )
    );
    return;
  }

  if (!nameEl.value.trim()) {
    alert(
      'Escribe el nombre del ingrediente.'
    );
    return;
  }

  const ok = await post(
    '/api/ingredients',
    {
      name: nameEl.value.trim(),
      unit: unitEl.value.trim(),
      stock: Number(stockEl.value || 0),
      min_stock: Number(minEl.value || 0),
      base_cost: Number(costEl.value || 0)
    }
  );

  if (ok) {
    openM('inv');
  }
}


/* =========================
   COMPRAS
========================= */

async function buy() {

  if (S.ingredients.length === 0) {
    alert(
      'Primero debes crear un ingrediente.'
    );
    return;
  }

  const ok = await post(
    '/api/purchases',
    {
      date: $('date')?.value || today(),
      ingredient_id:
        Number($('iid')?.value || 0),
      qty:
        Number($('qty')?.value || 0),
      total:
        Number($('total')?.value || 0),
      account:
        $('account')?.value || 'Caja'
    }
  );

  if (ok) {
    openM('buy');
  }
}


/* =========================
   RECETAS
========================= */

async function saveRecipe() {

  if (S.ingredients.length === 0) {
    alert(
      'Primero debes crear ingredientes.'
    );
    return;
  }

  const rows =
    [...document.querySelectorAll('#rr .i')];

  if (rows.length === 0) {
    alert(
      'Añade al menos un ingrediente a la receta.'
    );
    return;
  }

  const ingredients = rows.map(
    row => ({
      ingredient_id:
        Number(
          row.querySelector('.ri')?.value || 0
        ),

      qty:
        Number(
          row.querySelector('.rq')?.value || 0
        )
    })
  );

  const ok = await post(
    '/api/products',
    {
      name:
        $('name')?.value?.trim() || '',

      yield_qty:
        Number(
          $('yieldQty')?.value || 1
        ),

      price:
        Number(
          $('price')?.value || 0
        ),

      pack_cost:
        Number(
          $('pack')?.value || 0
        ),

      other_cost:
        Number(
          $('other')?.value || 0
        ),

      waste_pct:
        Number(
          $('waste')?.value || 0
        ),

      ingredients
    }
  );

  if (ok) {
    openM('recipes');
  }
}


/* =========================
   ÓRDENES
========================= */

async function createOrder() {

  if (S.products.length === 0) {
    alert(
      'Primero debes crear un producto.'
    );
    return;
  }

  const ok = await post(
    '/api/orders',
    {
      date:
        $('date')?.value || today(),

      product_id:
        Number(
          $('pid')?.value || 0
        ),

      qty:
        Number(
          $('qty')?.value || 0
        )
    }
  );

  if (ok) {
    openM('orders');
  }
}
